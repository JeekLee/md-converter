[project]
name = "md-converter"
version = "0.1.0"
description = "HWP / HWPX to Markdown converter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# HWPX has no runtime deps (stdlib only).
# HWP5 requires olefile for OLE compound-file reading.
[project.optional-dependencies]
hwp5      = ["olefile>=0.47"]
images    = ["Pillow>=10.0"]          # BMP → PNG conversion
pdf       = ["pdfplumber>=0.11", "pypdf>=4.0", "Pillow>=10.0"]
pdf-ocr   = ["pdfplumber>=0.11", "pypdf>=4.0", "Pillow>=10.0", "pytesseract>=0.3"]
dev       = ["pytest>=8", "olefile>=0.47", "Pillow>=10.0", "pdfplumber>=0.11", "pypdf>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md_converter"]
